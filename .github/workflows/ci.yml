name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Formatting
        run: npm run format:check

      - name: Flag images
        run: npm run check:flags

      - name: Build
        run: npm run build

      # The service worker route logs and returns a 500 rather than failing
      # the build, so check the built worker is real JavaScript.
      - name: Service worker built
        run: |
          sw=.next/server/app/serwist/sw.js.body
          test -s "$sw"
          head -c 40 "$sw" | grep -q "const __PRECACHE_MANIFEST__"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
